name: Deploy header Worker to Cloudflare

# Deploys link-headers-worker/ (paulromeo-agent-headers) so the live Worker
# always matches main. Runs only when the Worker or this workflow changes.
on:
  push:
    branches: [main]
    paths:
      - "link-headers-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 476e8329138105128be1c7698eb79d16
          wranglerVersion: "4.159.0"
          workingDirectory: link-headers-worker
          command: deploy
